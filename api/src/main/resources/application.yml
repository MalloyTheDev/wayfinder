spring:
  application:
    name: wayfinder-api

  datasource:
    # No credentials in the repository. The defaults point at a local development database
    # and are overridden by environment variables everywhere else.
    url: ${WAYFINDER_DB_URL:jdbc:postgresql://localhost:5432/wayfinder}
    username: ${WAYFINDER_DB_USER:wayfinder}
    password: ${WAYFINDER_DB_PASSWORD:wayfinder}
    hikari:
      # Small on purpose. Connections cost memory at both ends, and a managed Postgres
      # free tier counts them. Ten per instance is ample for a read-heavy catalog and
      # leaves headroom for the migration step to connect during a deploy.
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Flyway owns the schema. Letting Hibernate generate it would mean production and
      # tests run against a schema nobody reviewed, and would silently drop the CHECK
      # constraints that enforce AC-01.3 and AC-01.4.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # On by default so a developer and the test suite get a migrated schema without
    # thinking about it. In production this is turned off by environment variable and
    # migrations run once, in their own step, before any new instance takes traffic. A
    # failing migration then stops the deploy instead of leaving half the fleet running
    # against a schema it does not expect.
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  lifecycle:
    # Long enough for in-flight requests to finish, short enough that a stuck request
    # does not hold a blue-green cutover open indefinitely.
    timeout-per-shutdown-phase: 25s

management:
  endpoints:
    web:
      exposure:
        # Health only. Every additional endpoint is surface area, and nothing yet needs more.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  # Stop accepting new connections, let in-flight requests finish, then exit. Without
  # this, a deploy or a restart drops whatever was in flight.
  shutdown: graceful

  error:
    # Error responses are built by ApiExceptionHandler. Never leak a stack trace.
    include-stacktrace: never
    include-message: never
