# Pins the Maven version so a local build and a CI build run the same tool.
# distributionType=only-script means the wrapper downloads Maven itself rather than
# committing a maven-wrapper.jar to the repository, so there is no binary to audit.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
