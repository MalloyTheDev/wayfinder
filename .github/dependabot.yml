version: 2

# The npm ecosystem is added in M2, when the client has a manifest to read. Declaring it
# against a directory with no manifest only produces update errors.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Update
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: monthly
    commit-message:
      prefix: Update
    labels:
      - dependencies
