name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Each job does real work. The client build job arrives in M2 alongside the client; a
# pipeline with jobs that pass because they do nothing is worse than a short pipeline.
jobs:
  criteria:
    name: Acceptance criteria (T-CRIT-001)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Every criterion has a measure and a verification reference
        run: node tools/check-criteria.mjs

      - name: The checker rejects a backlog that breaks the rule
        run: |
          # A gate that has never been seen to fail is not yet known to be a gate.
          # This fixture seeds the exact fault the original project shipped, a criterion
          # reading "ranked low" with nothing to falsify it.
          fixture="$(mktemp -d)/broken.md"
          cat > "$fixture" <<'FIXTURE'
          ## US-01 Deliberately broken fixture

          Origin: a fixture used to prove the checker fails when it should.

          | ID | Acceptance criterion | Measure | Verified by |
          | --- | --- | --- | --- |
          | AC-01.1 | Unlikely destinations are ranked low | ranked low | Pending M2 |
          FIXTURE

          if node tools/check-criteria.mjs "$fixture"; then
            echo "::error::the checker passed a backlog it should have rejected"
            exit 1
          fi
          echo "confirmed: the checker rejects an unfalsifiable criterion"

  api:
    name: API build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Persistence tests run against real Postgres through Testcontainers, which needs a
      # Docker daemon. The ubuntu runner has one, so no setup step is required; this check
      # exists so that an absent daemon fails here with a clear message rather than as a
      # wall of connection errors inside the test report.
      - name: Confirm a Docker daemon is available
        run: docker info --format 'docker {{.ServerVersion}}'

      - name: Build and test
        working-directory: api
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore
