name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by the deploy workflow, so deployment waits on the full suite rather than
  # racing it.
  workflow_call:

# Least privilege. Without this the token gets whatever the repository default is, which
# is broader than reading source, and a compromised dependency in a build step inherits
# it. CodeQL flags the omission, correctly.
permissions:
  contents: read

# Each job does real work. The client build job arrives in M2 alongside the client; a
# pipeline with jobs that pass because they do nothing is worse than a short pipeline.
jobs:
  criteria:
    name: Acceptance criteria (T-CRIT-001)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: the change-impact check diffs the backlog against a base commit,
          # which a shallow clone does not have.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Also checks traceability in both directions: a criterion naming a test that does
      # not exist, and a test labelled with an identifier no criterion claims.
      - name: Every criterion declares a basis, a measure and a verification reference
        run: node tools/check-criteria.mjs

      # IEC 62304 clause 7.3.3 in miniature: a change upstream forces review downstream.
      # Rewording a criterion without revisiting its test is how living documentation
      # quietly stops being true, so the build asks for an explicit acknowledgement.
      - name: Criterion changes were reviewed against their tests
        run: |
          base="${{ github.event_name == 'pull_request'
                    && github.event.pull_request.base.sha
                    || github.event.before }}"

          # Absent on the first push to a branch, and unresolvable after a force push.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit for this event, skipping change-impact analysis"
            node tools/check-criteria.mjs
          else
            node tools/check-criteria.mjs --changed-since "$base"
          fi

      # A gate that has never been seen to fail is not yet known to be a gate. These two
      # steps are the qualification suite: one fixture breaks every rule once, the other
      # uses every rule correctly. Both directions matter, because a checker that rejected
      # everything would pass the first step while being useless.
      - name: The checker rejects a backlog that breaks the rules
        run: |
          if node tools/check-criteria.mjs tools/fixtures/invalid-unfalsifiable.md; then
            echo "::error::the checker accepted a backlog it should have rejected"
            exit 1
          fi
          echo "confirmed: the checker rejects unfalsifiable criteria"

      - name: The checker accepts a backlog that follows them
        run: |
          if ! node tools/check-criteria.mjs tools/fixtures/valid-control.md; then
            echo "::error::the checker rejected a backlog that follows every rule"
            exit 1
          fi
          echo "confirmed: the checker accepts correctly written criteria"

      # Traceability cannot be fixture-tested the same way, because it reads the real test
      # sources rather than the file under test. So prove it with a real orphan: plant a
      # test identifier no criterion claims, require the build to go red, then remove it.
      - name: The checker rejects a test identifier no criterion claims
        run: |
          probe=tools/.traceability-probe.mjs
          printf '// Planted by CI to prove the traceability check fails. T-PROBE-999\n' > "$probe"
          if node tools/check-criteria.mjs; then
            rm -f "$probe"
            echo "::error::the checker accepted an orphan test identifier"
            exit 1
          fi
          rm -f "$probe"
          echo "confirmed: the checker rejects a test nothing asked for"

          # And passes again once it is gone, so the step above failed for the right reason.
          node tools/check-criteria.mjs > /dev/null

  api:
    name: API build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Persistence tests run against real Postgres through Testcontainers, which needs a
      # Docker daemon. The ubuntu runner has one, so no setup step is required; this check
      # exists so that an absent daemon fails here with a clear message rather than as a
      # wall of connection errors inside the test report.
      - name: Confirm a Docker daemon is available
        run: docker info --format 'docker {{.ServerVersion}}'

      - name: Build and test
        working-directory: api
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore
