name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys running migrations at once is a genuinely bad day. Queue them instead, and
# do not cancel one in flight: cancel-in-progress is the right default for a test run and
# the wrong one for anything that touches a schema.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The default for every job. The deploy job widens it to packages: write for the registry
# push; nothing else needs more than reading source.
permissions:
  contents: read

jobs:
  # Deployment waits on the full CI suite rather than racing it. A green pipeline is the
  # precondition for shipping, which is what AC-00.5 asks for.
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build image and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Nothing is configured yet: there is no Fly account, no Neon database and no token.
      # This job exists ready to run rather than failing every push until it is. When the
      # secret appears, the remaining steps start working with no edit to this file.
      - name: Check whether deployment is configured
        id: configured
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set, so deployment is skipped. See docs/deployment.md."
          fi

      - name: Log in to the container registry
        if: steps.configured.outputs.ready == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA, never by a moving tag. Rollback is redeploying a previous
      # digest, which is impossible if every build overwrote the same name.
      - name: Build and push the image
        if: steps.configured.outputs.ready == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: api
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up flyctl
        if: steps.configured.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      # The release command inside fly.toml runs migrations first and fails the deploy on
      # a non-zero exit, so a bad migration never reaches a running instance.
      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --image "ghcr.io/${{ github.repository }}:${{ github.sha }}"

      # A deploy that reports success without anyone checking the service answers is a
      # deploy that reports success. Blue-green means traffic has already moved by now,
      # so a failure here is the signal to roll back.
      - name: Verify the live service
        if: steps.configured.outputs.ready == 'true'
        env:
          BASE_URL: ${{ vars.WAYFINDER_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::WAYFINDER_BASE_URL is not set"; exit 1; }

          status=$(curl -fsS "$BASE_URL/actuator/health" | tr -d ' ')
          echo "health: $status"
          echo "$status" | grep -q '"status":"UP"' || { echo "::error::service is not UP"; exit 1; }

          count=$(curl -fsS "$BASE_URL/api/destinations" | grep -o '"slug"' | wc -l)
          echo "destinations returned: $count"
          [ "$count" -eq 30 ] || { echo "::error::expected 30 destinations, got $count"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/destinations/no-such-place")
          echo "unknown slug returns: $code"
          [ "$code" = "404" ] || { echo "::error::expected 404 for an unknown slug, got $code"; exit 1; }

          echo "live service verified"
